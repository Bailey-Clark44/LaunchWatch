<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build --base-href`. It has to start and
    end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rocket launches, space station crews, spacewalks and space news, with alerts when plans change.">
  <meta name="theme-color" content="#0A0D12">
  <meta name="color-scheme" content="dark">

  <!-- Home screen on iPhone and iPad -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LaunchWatch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>LaunchWatch</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0A0D12; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #8E99AB; font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .25s ease;
    }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 2px; background: #1F2632; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #7FB2FF;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar" role="progressbar" aria-label="Loading LaunchWatch"></div>
  </div>

  <script>
    // Hide the loading screen once Flutter has painted.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });

    // Install support, read by lib/src/install_prompt_web.dart. Chrome, Edge
    // and Samsung Internet hand over an install prompt; Safari has none, so the
    // app explains Share > Add to Home Screen there instead.
    window.lwInstall = {
      prompt: null,
      standalone: function () {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      },
      ask: function () {
        var event = window.lwInstall.prompt;
        if (!event) return Promise.resolve('unavailable');
        window.lwInstall.prompt = null;
        event.prompt();
        return event.userChoice.then(function (choice) { return choice.outcome; });
      },
    };
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.lwInstall.prompt = event;
      window.dispatchEvent(new Event('lw-install-change'));
    });
    window.addEventListener('appinstalled', function () {
      window.lwInstall.prompt = null;
      window.dispatchEvent(new Event('lw-install-change'));
    });

    // Offline support. After the first load, hand the worker everything this
    // visit already downloaded so the next launch works without a network.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (registration) {
          setTimeout(function () {
            var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (registration.active) registration.active.postMessage({ type: 'cache-urls', urls: urls });
          }, 8000);
        }).catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
